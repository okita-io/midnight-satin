<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Midnight Satin - The Invitation</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&amp;family=Marcellus&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#D4AF37", // Metallic Gold
                        "void": "#050505", // True Void Black
                        "surface": "#121212", 
                        "accent": "#800020", 
                        "text-main": "#EAEAEA",
                        "text-muted": "#8A8A8A",
                    },
                    fontFamily: {
                        "display": ["Playfair Display", "serif"],
                        "heading": ["Cinzel", "serif"],
                        "body": ["Literata", "serif"],
                        "ui": ["Marcellus", "serif"],
                        "script": ["Pinyon Script", "cursive"],
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .silk-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
                pointer-events: none;
                z-index: 5;
            }
            .gold-underline {
                @apply border-b border-primary/40 focus:border-primary transition-colors duration-300 outline-none;
            }
            .gold-glow-button {
                box-shadow: 0px 4px 20px rgba(212, 175, 55, 0.2);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-void text-text-main font-body antialiased min-h-screen flex flex-col relative overflow-hidden">
<div class="silk-overlay"></div>
<div class="fixed -top-24 left-1/2 -translate-x-1/2 w-full max-w-lg h-[500px] bg-primary/10 blur-[100px] rounded-full pointer-events-none z-0"></div>
<div class="relative z-10 flex flex-col items-center justify-between min-h-screen px-8 pt-20 pb-12 w-full max-w-md mx-auto">
<header class="text-center">
<div class="mb-2">
<span class="material-symbols-outlined text-primary text-4xl mb-4 block" style="font-variation-settings: 'FILL' 1;">fluid</span>
</div>
<h1 class="font-display text-4xl md:text-5xl italic font-bold tracking-tight text-primary leading-tight">
                Midnight <br/> Satin
            </h1>
<div class="h-[1px] w-16 bg-primary/30 mx-auto mt-6"></div>
</header>
<main class="w-full flex-1 flex flex-col justify-center mt-12">
<div class="space-y-12">
<div class="relative group">
<label class="font-ui text-[10px] uppercase tracking-[0.2em] text-primary/60 mb-1 block">The Identity</label>
<input class="w-full bg-transparent py-3 font-body text-lg text-text-main placeholder:text-text-muted/30 gold-underline border-t-0 border-x-0 rounded-none px-0" placeholder="Email Address" type="email"/>
</div>
<div class="relative group">
<label class="font-ui text-[10px] uppercase tracking-[0.2em] text-primary/60 mb-1 block">The Secret Word</label>
<input class="w-full bg-transparent py-3 font-body text-lg text-text-main placeholder:text-text-muted/30 gold-underline border-t-0 border-x-0 rounded-none px-0" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="mt-16">
<button class="w-full bg-primary py-5 rounded-sm font-ui text-void font-bold uppercase tracking-[0.25em] text-sm hover:bg-white transition-all duration-500 gold-glow-button active:scale-[0.98]">
                    Enter the Boudoir
                </button>
<div class="text-center mt-6">
<a class="font-ui text-[10px] text-text-muted uppercase tracking-widest hover:text-primary transition-colors" href="#">Forgotten your key?</a>
</div>
</div>
</main>
<footer class="mt-auto pt-12 text-center">
<p class="text-text-muted/60 font-body italic text-sm mb-2">New to the sanctuary?</p>
<a class="font-script text-3xl text-primary hover:text-white transition-colors duration-300" href="#">
                Create an Account
            </a>
<div class="mt-12 flex items-center justify-center gap-2 opacity-30">
<div class="h-[1px] w-8 bg-primary"></div>
<span class="material-symbols-outlined text-[14px] text-primary">auto_awesome</span>
<div class="h-[1px] w-8 bg-primary"></div>
</div>
</footer>
</div>
<div class="fixed top-0 bottom-0 left-0 w-[1px] bg-gradient-to-b from-transparent via-primary/10 to-transparent"></div>
<div class="fixed top-0 bottom-0 right-0 w-[1px] bg-gradient-to-b from-transparent via-primary/10 to-transparent"></div>

</body></html>
